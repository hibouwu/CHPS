  <text x="904" y="204" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#1A2332">Conserver -O3 sur macOS</text>

  <path fill="#2E7D32" d="M889,225 H895 A1,1 0 0 1 896,226 V232 A1,1 0 0 1 895,233 H889 A1,1 0 0 1 888,232 V226 A1,1 0 0 1 889,225 Z" />
  <text x="904" y="234" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#1A2332">Ne pas généraliser</text>
  <text x="904" y="252" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#1A2332">-march=native</text>

  <path fill="#2E7D32" d="M889,273 H895 A1,1 0 0 1 896,274 V280 A1,1 0 0 1 895,281 H889 A1,1 0 0 1 888,280 V274 A1,1 0 0 1 889,273 Z" />
  <text x="904" y="282" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#1A2332">AVX-512 traité séparément</text>
  <text x="904" y="300" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#1A2332">sur AMD (Partie 2)</text>

  <path fill="#2E7D32" d="M889,331 H895 A1,1 0 0 1 896,332 V338 A1,1 0 0 1 895,339 H889 A1,1 0 0 1 888,338 V332 A1,1 0 0 1 889,331 Z" />
  <text x="904" y="340" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#1A2332">Aucun changement de code</text>
  <text x="904" y="358" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#546E7A">(analyse et décision seules)</text>

  <path fill="#E8F5E9" stroke="#2E7D32" stroke-width="1" d="M890,384 H1190 A6,6 0 0 1 1196,390 V430 A6,6 0 0 1 1190,436 H890 A6,6 0 0 1 884,430 V390 A6,6 0 0 1 890,384 Z" />
  <text x="1040" y="406" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#2E7D32" text-anchor="middle">-O3 suffit sur AArch64 :</text>
  <text x="1040" y="426" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2E7D32" text-anchor="middle">fmla.2d confirmé (objdump)</text>

  
  <path fill="#F4F7FA" stroke="#CFD8DC" stroke-width="1" d="M70,556 H1210 A6,6 0 0 1 1216,562 V658 A6,6 0 0 1 1210,664 H70 A6,6 0 0 1 64,658 V562 A6,6 0 0 1 70,556 Z" />
  <text x="88" y="582" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#546E7A">Autres travaux P1-D :</text>
  <text x="88" y="604" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#1A2332">overlap MPI · fusion collision · I/O distribué</text>
  <text x="88" y="632" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#546E7A">Rôle :</text>
  <text x="88" y="652" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#1A2332">diagnostic · portabilité · préparation pour la suite</text>
