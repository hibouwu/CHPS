  <path fill="#1565C0" d="M66,24 H67 A2,2 0 0 1 69,26 V54 A2,2 0 0 1 67,56 H66 A2,2 0 0 1 64,54 V26 A2,2 0 0 1 66,24 Z" />
  <text x="80" y="38" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A2332">P1-D · Diagnostics et décisions techniques</text>
  <text x="80" y="62" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#546E7A">pistes testées · décisions validées</text>
  <path fill="#1565C0" d="M1158,24 H1176 A4,4 0 0 1 1180,28 V38 A4,4 0 0 1 1176,42 H1158 A4,4 0 0 1 1154,38 V28 A4,4 0 0 1 1158,24 Z" />
  <text x="1167" y="37" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P1</text>
  <text x="1216" y="48" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#90A4AE" text-anchor="end">7 / 13</text>

  
  <text x="640" y="112" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#546E7A" text-anchor="middle">Certaines pistes testées n'ont pas été retenues, mais elles ont clarifié les choix techniques.</text>

  
  <path fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1" d="M72,136 H408 A8,8 0 0 1 416,144 V528 A8,8 0 0 1 408,536 H72 A8,8 0 0 1 64,528 V144 A8,8 0 0 1 72,136 Z" />
  <path fill="#546E7A" d="M67,136 H413 A3,2 0 0 1 416,138 V138 A3,2 0 0 1 413,140 H67 A3,2 0 0 1 64,138 V138 A3,2 0 0 1 67,136 Z" />
  <text x="240" y="162" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#546E7A" text-anchor="middle">SIMD testé</text>
  <line x1="84" y1="172" x2="396" y2="172" stroke="#EAF0F6" stroke-width="1" />

  <text x="88" y="200" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#1A2332">-march=native</text>
  <text x="88" y="224" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#1A2332">#pragma omp simd</text>
  <text x="88" y="266" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#546E7A">Hypothèse :</text>
  <text x="88" y="286" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#546E7A">plus de SIMD → plus rapide</text>

  <text x="88" y="330" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#546E7A">Plateforme cible :</text>
  <text x="88" y="350" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#1A2332">macOS AArch64</text>
  <text x="88" y="370" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#1A2332">Apple M3 (P/E cores)</text>

  <text x="88" y="414" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#546E7A">-O3 génère déjà NEON 2×double</text>
  <text x="88" y="436" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#546E7A">(fmla.2d — visible à l'objdump)</text>

  
