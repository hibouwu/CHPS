  <line x1="484" y1="172" x2="796" y2="172" stroke="#EAF0F6" stroke-width="1" />

  <text x="640" y="200" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#546E7A" text-anchor="middle">-O3 seul vs -O3 -march=native + simd</text>

  
  <path fill="#FFF5F5" stroke="#CFD8DC" stroke-width="1" d="M490,212 H790 A6,6 0 0 1 796,218 V266 A6,6 0 0 1 790,272 H490 A6,6 0 0 1 484,266 V218 A6,6 0 0 1 490,212 Z" />
  <text x="640" y="232" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#546E7A" text-anchor="middle">np=1, OMP=1</text>
  <text x="640" y="256" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#C62828" text-anchor="middle">62 → 54 MLUPS  (−13%)</text>

  
  <path fill="#FFF5F5" stroke="#CFD8DC" stroke-width="1" d="M490,284 H790 A6,6 0 0 1 796,290 V338 A6,6 0 0 1 790,344 H490 A6,6 0 0 1 484,338 V290 A6,6 0 0 1 490,284 Z" />
  <text x="640" y="304" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#546E7A" text-anchor="middle">np=1, OMP=4</text>
  <text x="640" y="328" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#C62828" text-anchor="middle">135 → 121 MLUPS  (−10%)</text>

  <text x="640" y="376" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#546E7A" text-anchor="middle">Diagnostic probable : lectures non contiguës</text>
  <text x="640" y="396" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#546E7A" text-anchor="middle">+ ordonnanceur P/E cores.</text>

  
  <path fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5" d="M872,136 H1208 A8,8 0 0 1 1216,144 V528 A8,8 0 0 1 1208,536 H872 A8,8 0 0 1 864,528 V144 A8,8 0 0 1 872,136 Z" />
  <path fill="#2E7D32" d="M867,136 H1213 A3,2 0 0 1 1216,138 V138 A3,2 0 0 1 1213,140 H867 A3,2 0 0 1 864,138 V138 A3,2 0 0 1 867,136 Z" />
  <text x="1040" y="162" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2E7D32" text-anchor="middle">Décision</text>
  <line x1="884" y1="172" x2="1196" y2="172" stroke="#EAF0F6" stroke-width="1" />

